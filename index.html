<style>
:root{

  padding-top:env(safe-area-inset-top,0px);

  --bg:#ECEEF3; --card:#FFFFFF; --ink:#14172B; --sub:#4E5470; --line:#C9CEDB;
  --accent:#E8336D; --accent-ink:#FFFFFF; --stub-shadow:rgba(20,23,43,.12);
  --font-d:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --font-b:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0F1122; --card:#1A1D36; --ink:#F1F2F8; --sub:#A4A9C6; --line:#33385B; --stub-shadow:rgba(0,0,0,.4); }
}
:root[data-theme="dark"]{ --bg:#0F1122; --card:#1A1D36; --ink:#F1F2F8; --sub:#A4A9C6; --line:#33385B; --stub-shadow:rgba(0,0,0,.4); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.8;font-size:16px}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
img{max-width:100%}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.logo{font-family:var(--font-d);font-size:26px;letter-spacing:.04em;text-decoration:none;line-height:1;cursor:pointer;background:none;border:0;padding:0}
.logo small{font-family:var(--font-b);font-size:11px;font-weight:500;color:var(--sub);margin-left:10px;letter-spacing:.06em}
.top nav{margin-left:auto;display:flex;gap:18px;font-size:14px;font-weight:700}
.top nav button{background:none;border:0;cursor:pointer;padding:6px 2px;border-bottom:2px solid transparent}
.top nav button:hover{border-color:var(--accent)}
.updated{margin-left:auto;font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
@media(max-width:640px){.top nav{display:none}.logo small{display:none}}

.hero{max-width:1120px;margin:0 auto;padding:44px 20px 20px;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.hero h1{margin:0;font-family:var(--font-d);font-weight:400;line-height:.95;font-size:clamp(72px,15vw,180px);letter-spacing:-.02em;color:var(--ink)}
.hero h1 .n{color:var(--accent)}
.hero h1 .k{display:block;font-size:.34em;letter-spacing:.04em;margin-bottom:.12em}
.hero p.lead{margin:18px 0 0;max-width:34em;color:var(--sub);font-size:16px}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.stat span{font-size:12.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:28px;gap:24px}}

.tonight{position:relative;background:var(--ink);color:var(--bg);border-radius:10px;padding:24px 24px 20px;box-shadow:0 14px 30px -14px var(--stub-shadow);transform:rotate(1.4deg)}
.tonight::before,.tonight::after{content:"";position:absolute;top:58%;width:24px;height:24px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.tonight::before{left:-12px}.tonight::after{right:-12px}
.tonight .t-label{font-size:12px;font-weight:700;opacity:.75}
.tonight .t-title{font-family:var(--font-d);font-size:clamp(18px,2.4vw,24px);line-height:1.35;margin:6px 0 8px;min-height:3.6em}
.tonight .t-cat{display:inline-block;font-size:11px;font-weight:900;padding:1px 10px;border-radius:4px}
.tonight .t-meta{font-size:12px;opacity:.7;margin-top:6px}
.tonight .t-perf{border-top:2px dashed color-mix(in srgb,var(--bg) 40%,transparent);margin:16px -24px 14px}
.tonight .t-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font-weight:900;font-size:14px;padding:10px 16px;border-radius:8px;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;border:1.5px dashed color-mix(in srgb,currentColor 55%,transparent);color:inherit;opacity:.82;transition:opacity .15s,background .15s,border-color .15s;font-size:12.5px}
.btn.sec:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent);border-color:currentColor}
.btn.sec .ic{display:inline-block;transition:transform .35s}
.btn.sec:active .ic{transform:rotate(180deg)}
.btn:active{transform:translateY(1px)}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sec{padding:52px 0 8px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{margin:0;font-family:var(--font-d);font-weight:400;font-size:clamp(24px,3.6vw,36px);line-height:1.2}
.sec-h p{margin:0;color:var(--sub);font-size:14px}

.picks{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}
.pick{position:relative;text-align:left;cursor:pointer;border:0;border-radius:12px;padding:20px;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:#fff}
.pick:first-child{min-height:300px}
.pick .p-no{position:absolute;top:8px;right:16px;font-family:var(--font-d);font-size:80px;line-height:1;opacity:.2}
.pick .p-cat{font-size:11px;font-weight:900;background:rgba(0,0,0,.28);align-self:flex-start;padding:1px 10px;border-radius:4px;margin-bottom:10px}
.pick h3{margin:0 0 8px;font-family:var(--font-d);font-weight:400;font-size:clamp(16px,1.9vw,21px);line-height:1.4}
.pick .p-lead{margin:0;font-size:13px;line-height:1.6;opacity:.92}
.pick:hover{filter:brightness(1.06)}
@media(max-width:820px){.picks{grid-template-columns:1fr}.pick,.pick:first-child{min-height:190px}}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:5px 15px;font-size:13.5px;font-weight:700;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{margin-left:auto;position:relative}
.search input{font:inherit;font-size:14.5px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;min-height:38px;width:220px;max-width:100%}
.search input::placeholder{color:var(--sub)}
@media(max-width:640px){.search{margin-left:0;width:100%}.search input{width:100%}}
.count{font-size:13.5px;color:var(--sub);margin:0 0 14px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:0;margin:0;list-style:none}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.ticket{position:relative;width:100%;display:grid;grid-template-columns:64px 1fr;text-align:left;cursor:pointer;background:var(--card);border:0;border-radius:8px;padding:0;box-shadow:0 6px 16px -10px var(--stub-shadow);overflow:visible}
.ticket::before,.ticket::after{content:"";position:absolute;left:64px;width:16px;height:16px;border-radius:50%;background:var(--bg);transform:translateX(-50%);z-index:1}
.ticket::before{top:-8px}.ticket::after{bottom:-8px}
.ticket:hover{transform:translateY(-2px);transition:transform .15s}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0;border-radius:8px 0 0 8px;border-right:2px dashed rgba(255,255,255,.55);color:#fff}
.stub b{font-family:var(--font-d);font-weight:400;font-size:20px;line-height:1}
.stub span{writing-mode:vertical-rl;font-size:11px;font-weight:900;letter-spacing:.1em}
.body{padding:15px 18px 15px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.body h3{margin:0;font-size:16px;line-height:1.5;font-weight:900}
.body p{margin:0;font-size:13.5px;color:var(--sub);line-height:1.65}
.body .meta{font-size:11.5px;color:var(--sub);font-weight:700}
.empty{padding:40px 0;text-align:center;color:var(--sub)}

/* article view */
#articleView{display:none}
#articleView.show{display:block}
#listView.hide{display:none}
.art-top{padding:28px 0 0}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub);padding:8px 0;min-height:40px}
.backbtn:hover{color:var(--ink)}
.art-cat{display:inline-block;font-size:12px;font-weight:900;padding:3px 12px;border-radius:5px;margin-bottom:14px}
.art-h1{font-family:var(--font-d);font-weight:400;font-size:clamp(24px,4.2vw,38px);line-height:1.45;margin:0 0 14px}
.art-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.art-desc{font-size:16.5px;font-weight:700;line-height:1.8;margin:0 0 30px;color:var(--ink)}
.art-body{max-width:42em}
.art-body h2{font-family:var(--font-d);font-weight:400;font-size:clamp(19px,2.6vw,24px);line-height:1.5;margin:38px 0 14px}
.art-body p{margin:0 0 16px;font-size:15.5px;line-height:1.9}
.art-body ul{margin:0 0 16px;padding-left:1.3em}
.art-body li{margin:0 0 9px;font-size:15.5px;line-height:1.8}
.art-sources{margin:40px 0 0;padding:20px 22px;background:var(--card);border-radius:10px;font-size:13px;color:var(--sub)}
.art-sources summary{cursor:pointer;font-weight:900;color:var(--ink);font-size:14px}
.art-sources ul{margin:12px 0 0;padding-left:1.2em}
.art-sources li{margin:0 0 6px;line-height:1.6}
.related{margin:44px 0 60px}
.related h3{font-family:var(--font-d);font-weight:400;font-size:20px;margin:0 0 16px}
.related .grid{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.related .grid{grid-template-columns:1fr}}

footer{margin-top:60px;background:var(--ink);color:var(--bg);padding:36px 20px calc(36px + env(safe-area-inset-bottom,0px))}
.f-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end}
.f-in .logo{font-size:32px;color:var(--bg)}
.f-in p{margin:6px 0 0;font-size:13.5px;opacity:.75;max-width:32em}
.f-in small{opacity:.6;font-size:11.5px}
.supervisor{margin-top:18px!important;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);font-size:12.5px!important;line-height:1.85;opacity:.85;max-width:32em}
.supervisor .sv-label{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 8px;margin-right:8px;opacity:1}
.supervisor .sv-name{font-family:var(--font-d);font-weight:400;font-size:15px;letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-motion:no-preference){
  .hero h1{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
}
</style>
</head>

<footer>

{id:1,cat:"映画",title:"映画『オデュッセイア』はIMAXで観るべき？ノーラン最新作の上映形式・上映時間・興行記録【2026年9月】",
meta:"ノーラン最新作『オデュッセイア』は全編IMAXフィルムカメラで撮影。上映時間172分、国内は公開13日で興収15億円突破。IMAX・Dolby・4DXなど6種9バージョンの選び方を解説。",
kw:["オデュッセイア","ノーラン","IMAX","上映時間","上映形式"],
sum:"全編IMAX撮影は史上初。6種9バージョンの上映形式、172分の長さ、国内興収15億円突破までを整理。",
lead:"クリストファー・ノーラン監督の最新作『オデュッセイア』が、9月11日に日本で公開されました。長編映画として初めて全編をIMAXフィルムカメラで撮影した作品です。上映形式が6種9バージョンもあり、どれで観るか迷う人も多いでしょう。この記事では、公開情報と興行データをもとに、選び方と観る前のポイントを整理します。",
sections:[
{h:"『オデュッセイア』はどんな映画？基本情報",p:[

"オデュッセウス役はマット・デイモンです。ノーラン作品への出演は『インターステラー』『オッペンハイマー』に続いて3作目になります。共演はトム・ホランド、アン・ハサウェイ、ロバート・パティンソン、ルピタ・ニョンゴ、ゼンデイヤ、シャーリーズ・セロンらです。",
"上映時間は2時間52分（172分）です。前作『オッペンハイマー』の約3時間をわずかに下回ります。ノーラン監督は、IMAXフィルム上映では3時間が今も限界だと説明しています。"]},
{h:"上映形式は6種9バージョン｜どれを選ぶ？",p:[
"日本では、2D（字幕・吹替）、IMAX、Dolby Cinema、4DX（字幕・吹替）、MX4D（字幕・吹替）、35mmフィルムの6種9バージョンで上映されています。9月4日から10日には、IMAXの先行上映も行われました。",
"初見でIMAXを選ぶ人は多いようです。公開初週末（9月11〜13日）のIMAX比率は、動員で34.5%、興行収入で43.2%でした。全編IMAXフィルムカメラで撮った作品だけに、大画面での体験を求める観客が集まったとみられます。",
"IMAXやDolby Cinemaなどには、追加料金がかかる劇場があります。料金は劇場や日時で異なるため、予約前に公式サイトで確認してください。"]},
{h:"世界と日本の興行記録",ul:[

"この規模は、2025年の日本映画界全体の年間興行収入（2,744億5,200万円）を1作品で上回る計算です。",
"国内では、公開3日間（9月11〜13日）で動員24万0,775人、興行収入4億5,171万円を記録し、初登場1位でした。",

p:["洋画の単発作品は、国内で伸び悩みやすいといわれます。それでも本作は、累計25億円超えが視野に入る水準です。なお、9月25〜27日の週末動員ランキングでは、公開3週目で6位でした（興行通信社調べ）。"]},
{h:"観る前のチェックポイント",ul:[
"上映時間が長いため、開映前の水分の摂り方や休憩の取り方を考えておく。",
"IMAXは満席の回が出ているため、早めに座席を押さえる。",
"原作を知らなくても、物語の軸は「故郷へ帰る旅」と分かりやすい。"]},
{h:"まとめ",p:["『オデュッセイア』は、上映形式で体験が大きく変わる作品です。大画面の没入感を重視するならIMAX、通常料金で観たいなら2D字幕や吹替が候補になります。まずは近くの劇場で、どの形式が上映されているかを確認してみてください。"]}

sources:["映画.com／Yahoo!ニュース「『オデュッセイア』国内興収15億円突破」（2026年9月24日）","映画ナタリー「映画動員ランキング」（2026年9月28日）","Fan's Voice「映画『オデュッセイア』をIMAXで観るべき理由」（2026年9月4日）","THE RIVER「『オデュッセイア』が3時間以下なのはIMAX上映設備の限界」（2026年7月18日）","映画『オデュッセイア』公式サイト"],related:[5,3,2]},

{id:2,cat:"映画",title:"【2026年上半期】映画興行収入ランキングTOP10｜ズートピア2が157億円、洋画5本が30億円超え",

kw:["映画 興行収入 ランキング 2026","上半期","ズートピア2","名探偵コナン"],
sum:"10億円超え22作品の内訳とTOP10を整理。コナンの邦画初の記録、洋画の健闘、下半期のヒットまで。",
lead:"2026年の上半期は、洋画の健闘が目立つ半年でした。映画.comの集計では、興行収入10億円を超えた作品は22本です。この記事では、その中からTOP10を数字とともに紹介します。ヒットの目安や、下半期に伸びた作品もあわせて整理します。",
sections:[
{h:"ヒットの目安は10億円・30億円・100億円",p:[
"映画業界では、興行収入10億円がヒットの一つの目安です。30億円を超えると大ヒット、100億円を超えるとメガヒットと評価されます。",
"2026年上半期（2025年12月1日〜2026年6月30日公開）で10億円を突破したのは22作品でした。内訳は洋画が9本、邦画が13本です。30億円を超えたのは、洋画が5本、邦画が3本でした。"]},
{h:"上半期TOP10（興収は各記事時点）",ul:[
"1位『ズートピア2』157.4億円（7月14日時点）",
"2位『名探偵コナン ハイウェイの堕天使』135.7億円（7月13日時点）",
"3位『ザ・スーパーマリオギャラクシー・ムービー』78.5億円（7月15日時点）",
"4位『Michael マイケル』57.2億円（7月14日時点）",
"5位『プラダを着た悪魔2』54億円（7月5日時点）",
"6位『ほどなく、お別れです』46.6億円（5月29日時点）",
"7位『映画ドラえもん 新・のび太の海底鬼岩城』42.5億円（5月31日時点）",
"8位『スター・ウォーズ マンダロリアン・アンド・グローグ』30億円（6月29日時点）",
"9位『SAKAMOTO DAYS』28億円（7月14日時点）",
"10位『機動戦士ガンダム 閃光のハサウェイ キルケーの魔女』27億円（4月27日時点）"],
p:["上位5本のうち4本が洋画でした。『プラダを着た悪魔2』は、前作の興収17億円の3倍以上に伸びています。"]},
{h:"記録と傾向｜コナンは邦画史上初",p:[
"『名探偵コナン ハイウェイの堕天使』は、4月10日に公開された劇場版第29作です。4作連続で興収100億円を超え、邦画史上初の記録になりました。",
"配給別では、東宝が9本（子会社の東宝東和を含めると11本）、ディズニーが5本ランクインしています。強力なシリーズ作品や続編が、上位を占めた形です。",
"『Michael マイケル』は、伝記映画として初めて世界興収10億ドルを突破しています。日本でも6月12日の公開から、57億円台まで伸びました。"]},
{h:"下半期に伸びた作品",p:[
"7月24日公開の『映画ちいかわ 人魚の島のひみつ』は、公開62日間で興収165億円を突破しました。歴代興収ランキングでは15位に入っています。興行通信社によると、2026年公開作の中で1位です。",
"9月11日公開の『オデュッセイア』も、国内で興収15億円を超えました。下半期は、これらの作品が年間ランキングの主役になりそうです。年間の順位は、例年1月に確定します。"]},
{h:"まとめ",p:["2026年上半期は、アニメと洋画の続編が興行を引っ張りました。邦画の実写は苦戦した一方で、ヒット作は生まれています。気になる作品は、配信や再上映で追いかけてみてください。"]}
],
sources:["映画.com「26年上半期・10億円超の国内映画ランキング」（2026年7月18日）","アニメ！アニメ！「映画ちいかわ 興収158.4億円突破」（2026年9月22日）","MANTANWEB「映画ちいかわ 興収165億円突破」（2026年9月24日）"],related:[1,18,19]},

{id:3,cat:"映画",title:"第39回東京国際映画祭2026の見どころ｜オープニングは『SUKIYAKI』、『ゴジラ-0.0』は11月3日公開",
meta:"第39回東京国際映画祭は10月26日〜11月4日開催。オープニングは『SUKIYAKI 上を向いて歩こう』、センターピースは『ゴジラ-0.0』。会場・日程と、秋に観たい映画もまとめました。",
kw:["東京国際映画祭 2026","ゴジラ-0.0","SUKIYAKI","10月 公開映画"],
sum:"10月26日開幕。オープニング・センターピース・クロージングの3作と、映画祭前後に観たい秋の公開作を紹介。",
lead:"第39回東京国際映画祭が、2026年10月26日に開幕します。オープニングからクロージングまでの3作品が決まり、注目が集まっています。この記事では、開催概要と3作品の情報を整理します。あわせて、映画祭の前後に劇場で観たい秋の作品も紹介します。",
sections:[
{h:"開催概要｜日程と会場",ul:[
"会期は2026年10月26日（月）〜11月4日（水）の10日間です。",
"会場は、日比谷・有楽町・丸の内・銀座エリアです。",
"併設の映像コンテンツ市場「TIFFCOM 2026」は、10月28日〜30日に東京都立産業貿易センター浜松町館で開かれます。",
"特集として、溝口健二特集、アニメーション特別シンポジウム、TIFFティーンズ映画教室10周年企画などが決まっています。"],
p:["ガラ・セレクション部門とアニメーション部門の全作品も発表され、予告編も公開されました。映画館のスクリーンを再利用したオリジナルグッズも販売されます。"]},
{h:"オープニング・センターピース・クロージングの3作",p:[
"オープニング作品は、『SUKIYAKI 上を向いて歩こう』です。全米No.1になった名曲「上を向いて歩こう」の誕生秘話を描く音楽映画で、戦後の日本人を勇気づけた3人のアーティストが登場します。",
"映画祭の中盤を飾るセンターピースは、『ゴジラ-0.0』です。山崎貴監督が監督・脚本・VFXを務め、神木隆之介と浜辺美波が出演します。前作『ゴジラ-1.0』は、第96回アカデミー賞で視覚効果賞を受賞しました。本作の日本公開は、11月3日（火・祝）です。",
"クロージング作品は、ヨン・サンホ監督の『コロニー』です。『新感染 ファイナル・エクスプレス』の監督が手がける、パニック・アクションになります。ソウルの超高層ビルに閉じ込められた人々が、進化する感染者と戦います。日本公開は2027年の予定です。"]},
{h:"映画祭の前後に観たい秋の映画",ul:[

"『愛し合ってるかい？ 忌野清志郎が教えてくれた』（10月2日公開）：デビュー55周年のドキュメンタリーです。",
"『太陽を盗んだ男』（10月16日公開）：4Kデジタルリマスター版で上映されます。",
"『劇場版「進撃の巨人」前編 紅蓮の弓矢』（10月23日〜）：SCREEN X、4DX、ULTRA 4DXで再上映されます。"]},
{h:"まとめ",p:["東京国際映画祭は、国内外の新作を一度に楽しめる10日間です。チケットの販売状況や上映スケジュールは、公式サイトで最新情報を確認してください。"]}
],
sources:["第39回東京国際映画祭 公式サイト（2026年9月2日・9月18日発表）","ぴあ映画「オープニング、センターピース、クロージング作品決定」","映画.com（2026年9月2日・9月18日・9月22日・9月26日配信記事）","映画ナタリー「映画動員ランキング」（2026年9月28日）"],related:[14,5,1]},

{id:4,cat:"映画",title:"映画館の料金2026年9月最新｜TOHOシネマズ改定後の相場と、安く観る方法まとめ",

kw:["映画 料金 2026","映画館 安い日","TOHOシネマズ 値上げ","映画を安く見る方法"],

{h:"曜日・日付・時間帯で安く観る",ul:[

{h:"会員・カード・サブスクで安く観る",ul:[

"TOHO-ONE有料会員：毎週火曜が1,300円です。",

"U-NEXTポイント：1,800ポイントで映画チケットに交換できます。",
"障がい者割引：手帳の提示で、本人と付添者1名が1,000円になる劇場が多くあります。"],

sources:["アプリオ「【2026年9月】映画を安く見る方法まとめ」（2026年9月14日）","プライシー「【2026年最新】TOHOシネマズ値上げ」（2026年6月5日）","プライシー「映画料金の値上げはいつから？」（2026年5月18日）"],related:[3,5,14]},

{id:5,cat:"映画",title:"『アベンジャーズ／エンドゲーム：アンコール』は観るべき？新映像・上映時間・ドゥームズデイとの関係",

{h:"『ドゥームズデイ』との関係",p:[

{id:7,cat:"ドラマ",title:"朝ドラ『ブラッサム』9月28日スタート｜宇野千代がモデル、石橋静河ヒロインのあらすじと見どころ",
meta:"NHK連続テレビ小説『ブラッサム』が9月28日に開始。宇野千代をモデルに、山口・岩国生まれの葉野珠を石橋静河が演じます。あらすじ、主要キャスト、放送時間をまとめました。",
kw:["ブラッサム 朝ドラ","石橋静河","宇野千代","あらすじ","キャスト"],
sum:"第115作の朝ドラが今日始動。ヒロイン・葉野珠の生涯、主要キャスト、放送時間を整理。",
lead:"2026年度後期の朝ドラ『ブラッサム』が、9月28日に始まりました。ヒロインは石橋静河で、作家の宇野千代をモデルにしたオリジナルの物語です。前作『風、薫る』は9月25日に最終回を迎えています。この記事では、あらすじと見どころ、放送情報を整理します。",
sections:[
{h:"基本情報｜放送時間と制作陣",ul:[
"連続テレビ小説の第115作です。9月28日（月）から放送されます。",
"NHK総合は月〜土の午前8時です（土曜は1週間の振り返り）。BSとBSプレミアム4Kは、月〜金の午前7時30分です。",
"脚本は櫻井剛です。宇野千代をモデルにしますが、原作はなく、フィクションとして描かれます。",
"タイトルの「ブラッサム」には、花が咲き誇れ、という思いが込められています。"]},
{h:"あらすじ｜明治・大正・昭和を駆けた女性作家",p:[
"ヒロインの葉野珠（はの たま）は、1897年（明治30年）に山口県岩国で生まれます。2歳で実母を亡くし、破天荒で厳しい父・清治（渡部篤郎）と、継母のリョウ（国仲涼子）らと暮らします。",
"女学校を卒業して代用教員になりますが、解雇されて親戚を頼り上京します。小説の懸賞への応募をきっかけに、作家として歩み始めます。",
"その後は、結婚、離婚、借金など、多くの困難に直面します。それでも自分らしい道を切り開いていく姿が描かれます。第1週「私の父、私の母」では、幼少期と80代の珠が交互に登場します。"]},
{h:"主なキャスト",ul:[
"石橋静河（葉野珠）：1994年生まれの32歳です。石橋凌と原田美枝子の次女で、初主演映画で多数の新人賞を受けました。",
"染谷将太：若き小説家・西尾一路を演じます。",
"尾野真千子：「少女小説」でブレイクした人気作家・土橋風子を演じます。",
"錦戸亮：常識に縛られない洋画家・夏井銀児を演じます。",
"イッセー尾形：珠が愛読する海外文学の翻訳家・小山牛丸を演じます。"],
p:["石橋は、決定から撮影までの約1年、宇野千代の著書『生きて行く私』などを読み込んだと語っています。"]},
{h:"まとめ",p:["朝ドラは、1回15分と短く、見始めやすいドラマです。第1週から追えば、珠の人生の全体像がつかめます。見逃した回は、NHKの配信で確認してください。"]}
],
sources:["Japaaan「『ブラッサム』石橋静河主演の新朝ドラスタート！第1週あらすじ」（2026年9月）","ORICON NEWS「連続テレビ小説『ブラッサム』作品情報」","モデルプレス「【ブラッサム 初回あらすじ】」（2026年9月28日）","Wikipedia「ブラッサム」","ステラnet「連続テレビ小説『ブラッサム』」（2026年9月27日）"],related:[6,10,8]},

{id:8,cat:"ドラマ",title:"『救命病棟24時』第6シリーズが10月12日スタート｜13年ぶりの月9復活、江口洋介×松嶋菜々子の見どころ",
meta:"医療ドラマの金字塔『救命病棟24時』が13年ぶりに復活。10月12日から月9で放送。江口洋介と松嶋菜々子は16年ぶりの共演です。放送時間、制作陣、予習の方法をまとめました。",
kw:["救命病棟24時 2026","月9","江口洋介","松嶋菜々子","放送日"],
sum:"シリーズ初の月9枠、16年ぶりの共演。放送日、制作陣、TVerでの予習方法まで。",
lead:"1999年に始まった医療ドラマ『救命病棟24時』が、13年ぶりに戻ってきます。第6シリーズは、10月12日からフジテレビの月9枠で放送されます。江口洋介と松嶋菜々子のダブル主演は、16年ぶりの再共演です。この記事では、放送情報と見どころ、予習の方法をまとめます。",
sections:[
{h:"放送情報と主な制作陣",ul:[
"放送日：2026年10月12日（月）スタートです。毎週月曜の午後9時で、初回は15分拡大です。",
"主演：江口洋介（進藤一生）と松嶋菜々子（小島楓）です。",
"脚本：第2シリーズなどを手がけた田邊満らが担当します。",
"プロデューサーは足立遼太朗、演出は柳沢凌介らです。"]},
{h:"なぜ注目されている？3つのポイント",p:[
"1つ目は、シリーズ初の月9枠での放送です。これまで連続ドラマ5シリーズとスペシャル5作が放送されてきました。",
"2つ目は、記録の更新です。第6シリーズにより、現代を舞台にしたフジテレビ制作の連続ドラマで、シリーズ最多記録を更新します。",
"3つ目は、主演2人の再共演です。2人が並ぶのは、2010年のスペシャルドラマ以来になります。江口は2026年に俳優デビュー40周年を迎えました。"]},
{h:"テーマは「令和の救命救急」",p:[
"制作側は、目の前の患者と向き合うことさえ難しくなった時代を背景にすると説明しています。過酷な現場でもがきながら生きる救命医たちの姿が、描かれます。",
"歴代シリーズは、毎回異なる医療の課題を取り上げてきました。今回、令和の現場で何が描かれるのかが、大きな注目点です。"]},
{h:"放送前に予習する方法",ul:[
"第1シリーズと第2シリーズは、8月26日からTVerで順次無料配信されています。",
"1話だけでも観ておくと、進藤と小島の関係性がつかみやすくなります。",
"配信の期間や話数は変更されることがあるため、TVerの画面で確認してください。"]},
{h:"まとめ",p:["長く愛されてきたシリーズが、令和の時代にどう生まれ変わるのか。10月12日の初回に向けて、旧作で予習しておくのがおすすめです。"]}
],
sources:["マイナビニュース「『救命病棟24時』13年ぶり復活」（2026年8月26日）","シネマトゥデイ「『救命病棟24時』13年ぶり復活」（2026年8月26日）","映画ナタリー「『救命病棟24時』13年ぶりに復活」","日刊ゲンダイDIGITAL（2026年9月）"],related:[6,9,11]},

{id:9,cat:"ドラマ",title:"『VIVANT』続編は10月4日から後半戦｜2クール連続放送の全体像と、休止中の復習ポイント",
meta:"日曜劇場『VIVANT』続編は第18話で前半戦が終了し、10月4日に第19話から再開。2クール連続の全体像、主要キャスト、休止の理由、復習の方法をまとめました。",
kw:["VIVANT 続編","日曜劇場","10月4日","第19話","休止 理由"],
sum:"3週間の休止を経て10月4日に再開。第2シーズンの構成と、再開前の復習ポイントを整理。",
lead:"日曜劇場『VIVANT』の続編は、9月13日の第18話で前半戦を終えました。2週連続の休止を経て、10月4日に第19話から後半戦が始まります。この記事では、2クール連続放送の全体像と、再開前に復習したいポイントをまとめます。",
sections:[
{h:"続編の基本情報",ul:[
"2023年夏に放送された前作の続編で、7月から2クール連続で放送されています。日曜劇場では異例です。",
"物語は前作のラストシーン直後から始まります。そのため、今作は第11話からスタートしました。",
"主人公は、表の顔はさえないサラリーマン、裏の顔は自衛隊の非公認部隊「別班」の諜報員・乃木憂助です。",
"堺雅人、阿部寛、二階堂ふみ、二宮和也、松坂桃李ら主要キャストが続投しています。アゼルバイジャンでも大規模ロケが行われました。",
"企画・監督は、『半沢直樹』を手がけた福澤克雄です。"]},
{h:"なぜ2週連続で休止したの？",p:[
"TBSは、9月20日と27日の放送休止を、秋の改編説明会で発表しました。9月16日から10月4日まで、アジア大会「愛知・名古屋」を独占生放送するためです。",
"番組の休止は、制作上のトラブルではなく、編成上の理由でした。前半戦の最終回から次回までは、約3週間空くことになりました。"]},
{h:"後半戦の見どころ｜第19話は「別班奪還作戦」",p:[
"次回の第19話は、別班員が囚われた状況を受けた奪還作戦から始まります。予告には、囚われた別班員や、チンギス、ノコル、薫らの姿が映し出されています。",
"スピンオフ『チンギス―VIVANT THE ORIGIN STORY―』も配信されています。林遣都が、若き日のノゴーン・ベキを演じています。"]},
{h:"再開までの復習ポイント",ul:[
"前作の最終回は、平均世帯視聴率19.6%（関東地区、ビデオリサーチ調べ）でした。",
"前半戦の第11〜18話を見返すと、伏線が整理しやすくなります。",
"U-NEXTなどで、本編とスピンオフを続けて観る方法もあります。配信状況は、各サービスで確認してください。"]},
{h:"まとめ",p:["後半戦は、最終回まで一気に進む見込みです。10月4日の第19話に向けて、前半戦のおさらいをしておくと、物語に入りやすくなります。"]}
],
sources:["日曜劇場『VIVANT』公式X（2026年9月13日）","日刊スポーツ／Yahoo!ニュース「TBSが2週連続休止を発表」（2026年9月）","cinemacafe.net「『VIVANT』第2シーズン、10月4日後半スタート」（2026年9月26日）","Yahoo!ニュース エキスパート「『VIVANT』続編が7月から2クール連続放送」（2026年6月）"],related:[6,8,10]},

{id:10,cat:"ドラマ",title:"大河ドラマ『豊臣兄弟！』第38回は10月4日｜2027年『逆賊の幕臣』は1月10日開始、松坂桃李が小栗忠順に",
meta:"大河ドラマ『豊臣兄弟！』は10月4日に第38回を放送。2027年の『逆賊の幕臣』は1月10日開始で、松坂桃李が小栗忠順を演じます。脚本、キャスト、見どころをまとめました。",
kw:["大河ドラマ 2027","逆賊の幕臣","豊臣兄弟","松坂桃李","小栗忠順"],
sum:"放送中の『豊臣兄弟！』と、2027年『逆賊の幕臣』の情報を整理。幕府側から描く幕末に注目。",
lead:"NHK大河ドラマは、2026年の『豊臣兄弟！』が終盤へ向かっています。同時に、2027年の『逆賊の幕臣』の情報も、次々と発表されています。この記事では、放送中の作品と次作の基本情報を整理します。",
sections:[
{h:"放送中の『豊臣兄弟！』｜10月4日は第38回",p:[
"『豊臣兄弟！』は、仲野太賀が主演を務める2026年の大河ドラマです。秀吉の弟を中心に、豊臣家の歩みを描きます。",
"10月4日放送の第38回では、秀吉が新たな「氏」を得ることになり、何と名乗るべきかを考える場面が描かれる予定です。"]},
{h:"2027年『逆賊の幕臣』の基本情報",ul:[
"大河ドラマ第66作で、完全オリジナルの物語です。",
"初回は、2027年1月10日（日）です。NHK ONEでの同時・見逃し配信も予定されています。",
"脚本は、『おかえりモネ』などを手がけた安達奈緒子です。",
"主演は松坂桃李で、小栗忠順を演じます。ライバルの勝海舟役は、大沢たかおです。"]},
{h:"主人公・小栗忠順とは？",p:[
"小栗忠順は、江戸幕府の幕臣で、勘定奉行や軍艦奉行を歴任した人物です。「勝海舟のライバル」と呼ばれ、日本初の遣米使節として新時代の文明を体感しました。",
"新しい国のかたちを構想した一方、明治新政府から「逆賊」とされ、歴史の闇に葬られました。2027年は、小栗の生誕200年にあたります。",
"敗者の側から近代化を描く視点が、本作の最大の特徴です。"]},
{h:"発表済みのキャスト",ul:[
"小栗の母に鈴木京香、妻に上白石萌音。",
"井伊直弼に岡部たかし。",
"若き日の友人役に、宮野真守、青木崇高ら。",
"9月15日の第7弾では、孝明天皇や明治天皇など、朝廷の面々が発表されました。"],
p:["2028年の大河ドラマは、山﨑賢人が主演する『ジョン万』と発表されています。"]},
{h:"まとめ",p:["『豊臣兄弟！』の結末を見届けたあとは、『逆賊の幕臣』で幕末を別の角度から眺められます。放送前に小栗忠順について調べておくと、初回がより楽しめます。"]}
],
sources:["NHK大河ドラマ『逆賊の幕臣』関連発表（ステラnet、2026年8月28日）","ciatr「2027年大河ドラマ『逆賊の幕臣』あらすじ・キャスト一覧」","映画ナタリー「松坂桃李が2027年の大河ドラマ『逆賊の幕臣』で主演」","cinemacafe.net「『豊臣兄弟！』第38回あらすじ」（2026年9月27日）","dolly9「大河ドラマ『逆賊の幕臣』のキャスト・相関図」"],related:[7,6,9]},

{id:11,cat:"ドラマ",title:"Netflix 2026年10月の配信ラインナップ｜役所広司×宮藤官九郎『俺のこと、なんか言ってた？』は10月22日",
meta:"Netflixの2026年10月の配信作品を紹介。役所広司主演『俺のこと、なんか言ってた？』は10/22、『サイバーパンク：エッジランナーズ2』は10/20。注目作の日付と見どころをまとめました。",
kw:["Netflix 10月 2026","配信予定","俺のこと、なんか言ってた？","エッジランナーズ2"],
sum:"日付が確認できた注目作を中心に、10月の配信予定を整理。日本発の新作から海外作品まで。",
lead:"Netflixが、2026年10月の配信ラインナップを発表しました。国内外のドラマや映画、アニメ、恋愛リアリティ、さらにプロレスのライブ配信まで幅広く揃います。この記事では、日付や内容が確認できた注目作を紹介します。",
sections:[
{h:"日本発の注目作｜『俺のこと、なんか言ってた？』",p:[
"役所広司が主演し、宮藤官九郎が脚本を務めるヒューマンコメディです。10月22日に独占配信されます。",
"主人公は、日本を代表する大物俳優の高瀬川玄です。英国での舞台公演で大成功を収めたあと、パンデミックが明けて2年ぶりに帰国しますが、日本では誰も彼のことを覚えていませんでした。承認欲求の強い高瀬川が、もう一度スポットライトを浴びようと奔走します。"]},
{h:"10月に配信される主な作品",ul:[
"『サイバーパンク：エッジランナーズ2』：10月20日に配信。SFアクションアニメの続編で、前作に続いてTRIGGERがアニメーション制作を担当します。",
"『エデンの東』：月初に配信。フローレンス・ピュー主演で、名作小説を映像化します。",
"『アニマルズ』：ベン・アフレックが監督・主演を務めるスリラー映画です。",
"『あいの里：シーズン3』：恋愛リアリティの新シーズンです。",
"『ブラック・ショーマン』『NEW GROUP』：中旬に見放題で独占配信されます。",
"『パディントン 消えた黄金郷の秘密』：月初に配信されます。",
"『らんま1/2』第3期：10月3日の放送直後から独占配信されます。"],
p:["配信日は変更されることがあります。詳細は、Netflixのアプリや公式サイトで確認してください。"]},
{h:"配信サービスの動き",p:[
"10月1日には、WOWOWとドコモの「新生Lemino」が始動します。スポーツ、音楽、ドラマを拡充し、国内最大級の総合エンタメプラットフォームを目指すとしています。",
"民放ドラマを追うならTVer、まとめて観るなら定額配信と、使い分ける人が増えています。"]},
{h:"まとめ",p:["10月のNetflixは、日本発の新作と海外作品がバランスよく並びます。まずは『俺のこと、なんか言ってた？』の10月22日を、カレンダーに入れておきましょう。"]}
],
sources:["Netflix 2026年10月配信ラインナップ（モデルプレス、2026年9月25日）","ciatr「2026年10月Netflixで見るべき新作は？」（2026年9月）","SCREEN ONLINE「Netflix 2026年10月の配信ラインナップが公開」","NewsCafe（2026年9月25日）"],related:[6,9,16]}
);

{id:14,cat:"音楽",title:"チケット高額転売はなぜ違法？不正転売禁止法の仕組みと、正規リセールサイトの使い方",
meta:"チケット不正転売禁止法は2019年6月14日に施行され、2026年で施行7年目。違反すると1年以下の懲役か100万円以下の罰金。文化庁が改めて適正な流通の確保を呼びかけています。",
kw:["チケット不正転売禁止法","高額転売","公式リセール","違法"],
sum:"施行から7年、文化庁は本人確認とリセールサイト整備の徹底を改めて要請。法律の仕組みと安全な譲渡方法を解説。",
lead:"人気のライブやコンサートのチケットが、定価の何倍もの価格で転売されているのを見かけたことはないでしょうか。「チケット不正転売禁止法」は、こうした高額転売を防ぐための法律です。施行から7年が経った今も、文化庁は適正な流通の確保を呼びかけています。この記事では、法律の仕組みと、正しい譲渡の方法を整理します。",
sections:[
{h:"チケット不正転売禁止法とは",p:[
"正式名称は「特定興行入場券の不正転売の禁止等による興行入場券の適正な流通の確保に関する法律」です。2019年6月14日に施行されました。",
"禁止されているのは、興行主の同意なく、反復継続の意思をもって元の価格を超える金額でチケットを転売する行為と、その転売を目的にチケットを譲り受ける行為です。違反した場合、1年以下の懲役、または100万円以下の罰金、あるいはその両方が科されます。"]},
{h:"施行7年、文化庁が改めて要請",p:[
"文化庁は、法施行7年の節目にあたり、興行主等に対して、興行入場券の適正な流通の確保に関する措置を改めて講じるよう依頼しています。",
"背景には、法律上の要件を満たしていないにもかかわらず、満たしているかのように見せる入場券や、著しく高額な転売価格になっているケースが今なお見られることがあります。一方で、入場時の本人確認や、チケットリセールサイトの設置といった取り組みも、着実に広がっているとされています。"]},
{h:"急に行けなくなったときはどうする？",ul:[
"公式のリセールサイト：興行主が事前に同意しているため、定価での転売が可能です。代表的なサービスに、ぴあが運営する「チケトレ」があります。",
"知人への譲渡：チケット購入者の親族や友人、同僚など、知人への譲渡は公式リセールを介さなくても認められています。",
"同一価格以下での転売：興行主の販売価格と同じか、それより安い価格での転売は、不正転売の対象になりません。"],
p:["「1回限りのやむを得ない事情による転売」は、反復継続の意思がないと判断されれば、違法とはみなされない場合があります。ただし、複数回にわたって高額転売を行った場合は違法となる可能性が高いため、注意が必要です。"]},
{h:"チケットを買うときの注意点",ul:[
"個人間の売買サイトやSNSでの高額な出品には手を出さない。",
"公演の規約で、転売が禁止されているかどうかを事前に確認する。",
"転売されたチケットは、入場時の本人確認で入場できない場合がある。"]},
{h:"まとめ",p:["行けなくなったチケットは、公式リセールか、身近な人への譲渡で手放すのが安全です。チケットを買う側も、正規の販売ルートを選ぶことが、結果として自分を守ることにつながります。"]}
],
sources:["文化庁「チケット不正転売禁止法に基づく興行入場券の適正な流通の確保に関する措置について（依頼）」（2026年）","政府広報オンライン「チケットの高額転売は禁止です！」","CPRA「チケット不正転売禁止法 Q&A」","NECソリューションイノベータ「チケット不正転売禁止法とは」"],related:[13,16,4]},

{id:15,cat:"音楽",title:"サブスクで名盤を「アルバム順」に聴き直す夜｜シャッフル再生をやめると見えてくるもの",
meta:"配信サービスの普及で、楽曲単位での再生が主流になった今こそ、アルバムを曲順どおりに聴く楽しみを見直したい。曲順の意図を読み解く、具体的な聴き方を紹介します。",
kw:["アルバム 聴き方","サブスク シャッフル","曲順 意味"],
sum:"シャッフル再生が当たり前になった今、あえて曲順どおりに聴くと見えてくる、アルバムという作品の設計を解説。",
lead:"Billboard JAPANの2026年上半期チャートでも、ストリーミングで再生される単曲がランキングの主役になっています。一方で、アルバムという単位で音楽を聴く楽しみは、あまり語られなくなりました。この記事では、曲順を意識して聴く、シンプルな楽しみ方を提案します。",
sections:[
{h:"アルバムは曲順そのものが作品",p:[
"1曲目には、アルバム全体の空気を決める役割があります。ゆったりとした導入で聴き手を迎え入れる場合もあれば、いきなり強い印象を残す曲を置く場合もあります。",
"中盤には、アルバムの中で最も実験的な曲や、テンポの変化を持たせる曲が配置されることが多いです。そして最後の曲には、アルバム全体を締めくくる役割が与えられます。"]},
{h:"具体的な聴き方",ul:[
"再生前に、曲数とおおよその再生時間を確認しておく。",
"シャッフルとリピートをオフにし、1曲目から順番に再生する。",
"曲と曲の間の「つながり方」に注目する。前の曲の余韻が、次の曲の出だしとどう響き合うかを意識する。",
"聴き終えたら、印象に残った曲と、その位置（何曲目だったか）をメモしておく。"]},
{h:"通して聴くと見えてくるもの",p:[
"単曲でヒットした曲も、アルバムの中で聴くと違う印象を持つことがあります。前後の曲との対比によって、明るく聞こえていた曲が実は切ない曲だった、と気づくこともあります。",
"アーティストによっては、アルバム全体で一つの物語を描いている場合もあります。曲名だけを見比べても気づきにくい構成が、通して聴くことで浮かび上がってきます。"]},
{h:"どんなときに向いている？",ul:[
"移動時間や作業中ではなく、他のことをしない時間を確保できるとき。",
"すでに知っている曲が多いアルバムを、あらためて聴き直すとき。",
"気になっているけれど、シングル曲しか聴いたことがないアーティストの作品。"]},
{h:"まとめ",p:["シャッフル再生は便利ですが、アルバム単位で聴くことでしか気づけない発見もあります。今夜は、お気に入りの1枚を、曲順どおりに最後まで聴いてみてください。"]}
],
sources:["Billboard JAPAN「2026年上半期チャート発表」（2026年6月5日）","本記事は音楽の聴き方に関する一般的な知見をもとに構成しています"],related:[12,17,16]},

{id:16,cat:"音楽",title:"ライブ初心者が失敗しない、持ち物と当日の立ち回り｜開演30分前到着が目安",
meta:"初めてのライブで戸惑わないための、持ち物と当日の流れをまとめました。耳栓や動きやすい靴の準備から、転売されたチケットのリスクまで解説します。",
kw:["ライブ 初心者","持ち物","立ち回り","チケット 注意"],
sum:"初めてのライブ参戦で困らないための持ち物と当日の流れ、チケットの入手時に気をつけたい点を整理。",
lead:"初めてのライブは、楽しみな反面、勝手が分からず不安なものです。持ち物や当日の流れを事前に知っておくだけで、余裕を持って音楽を楽しめます。この記事では、準備と当日の立ち回りのポイントをまとめます。",
sections:[
{h:"事前に準備しておきたい持ち物",ul:[
"耳栓：大音量の会場で耳を守るため、初心者ほど用意しておくと安心です。",
"動きやすい靴：スタンディング会場では、長時間立ちっぱなしになることがあります。",
"小さめのバッグ：ロッカーに入るサイズか、会場の持ち込み規定を事前に確認しておきます。",
"モバイルバッテリー：電子チケットを使う場合、スマートフォンの充電切れは入場に関わる問題になります。"]},
{h:"当日の動き方",p:[
"開演の30分前到着を目安にすると、余裕を持って入場できます。会場によっては、開場から開演までに時間がかかる場合もあるため、早めの行動が安心です。",
"初めての会場では、最寄り駅からの動線とロッカーの有無を、事前に地図アプリなどで確認しておくとスムーズです。"]},
{h:"チケットの入手は正規ルートで",p:[
"チケットは、正規のプレイガイドやファンクラブ先行を通じて購入するのが基本です。チケット不正転売禁止法により、興行主の同意のない高額転売は禁止されています。",
"どうしても行けなくなった場合は、興行主が認める公式リセールサイトを利用しましょう。個人間の高額な譲渡サイトで購入すると、入場時の本人確認で入れないことがあります。"]},
{h:"会場でのマナー",ul:[
"周囲の人の視界を長時間さえぎらない。",
"写真や動画の撮影が禁止されている場合は、スマートフォンをしまっておく。",
"声援やタオルの使用など、会場ごとのルールを事前に確認する。"]},
{h:"まとめ",p:["初めてのライブは、少しの準備で快適さが大きく変わります。持ち物と当日の流れを頭に入れて、安心して音楽に集中してください。"]}
],
sources:["政府広報オンライン「チケットの高額転売は禁止です！」","文化庁「チケット不正転売禁止法に基づく興行入場券の適正な流通の確保に関する措置について」（2026年）"],related:[14,13,12]}
);

sum:"劇場公開からちょうど1年でPrime Video独占配信へ。世界興収297億円の記録と主題歌のヒットを振り返る。",
lead:"劇場版『チェンソーマン レゼ篇』が、2026年9月19日からAmazon Prime Videoで見放題独占配信されています。劇場公開の2025年9月19日から、ちょうど1年での配信開始です。この記事では、配信情報と、この作品が残した記録を振り返ります。",
sections:[
{h:"配信情報",ul:[
"配信開始：2026年9月19日（土）午前0時から。",
"配信先：Amazonプライム・ビデオでの見放題独占配信です。視聴にはプライム会員登録が必要です。",
"9月4日時点では、Netflix・Hulu・U-NEXT・Disney+・dアニメストアでの配信予定は発表されていませんでした。",
"TVアニメ全12話と総集篇も、Prime Videoで見放題で視聴できます。"]},
{h:"世界興行収入297億円｜邦画アニメの記録",p:[

"公開103日間で観客動員655.8万人、興行収入100.1億円を突破したことが公式に発表されています。その後も興行収入は伸び続け、世界累計興行収入は297.8億円を突破しました。"]},
{h:"主題歌「IRIS OUT」が残した記録",p:[
"主題歌は米津玄師の「IRIS OUT」です。エンディングテーマは、米津玄師と宇多田ヒカルが共作した「JANE DOE」が起用されました。",
"「IRIS OUT」は、Billboard JAPANの2026年上半期チャートで総合首位となり、ストリーミング再生回数は史上最速となる4週間で1億回を突破しています。劇場アニメと主題歌が、それぞれ記録的な結果を残した組み合わせでした。"]},
{h:"シリーズの今後",p:[

],
sources:["ケータイWatch「チェンソーマンの劇場版『レゼ篇』がPrime Videoで独占配信」（2026年）","showcase-tv.com（2026年9月16日）","VODコンパス「チェンソーマン レゼ篇の配信はいつから？」（2026年9月）","selectra.jp（2026年9月）","chainsawman.dog 公式ニュース（2026年8月25日）"],related:[17,1,2]},

{id:19,cat:"アニメ・マンガ",title:"完結済みマンガを一気読みする、週末の読書計画の立て方",
meta:"連載を追わなくていい「完結済み作品」の一気読みは、まとまった時間がある週末におすすめです。巻数の区切り方や、最終巻を読む前後の過ごし方を具体的に紹介します。",
kw:["マンガ 一気読み","週末 読書","完結済み"],
sum:"連載中の作品にはない、完結済みマンガならではの読み方を提案。巻数の区切り方から最終巻の迎え方まで。",
lead:"連載中のマンガは、続きが気になっても次の巻を待つ必要があります。一方、完結済みの作品は、手元にそろえてしまえば、好きなタイミングで一気に読み進められます。この記事では、週末を使った一気読みの計画の立て方を紹介します。",
sections:[
{h:"読む前の準備",ul:[
"総巻数を確認し、1日でどこまで読むかをおおまかに決めておく。",
"区切りの良い巻数（物語の大きな転換点など）で休憩を挟めるよう、あらすじサイトなどで話数の区切りを軽く確認しておく。",
"飲み物と軽食を、手の届く場所に用意しておく。"]},
{h:"一気読みのペース配分",p:[
"全10巻程度の作品なら、1日で読み切ることも可能です。20巻を超える大作は、土日の2日間に分けると負担が少なくなります。",
"読み始めてすぐに次の巻へ進むのではなく、1巻ごとに数分の休憩を入れると、集中力を保ちやすくなります。目を休めることも忘れないようにしましょう。"]},
{h:"最終巻を読む前にしておきたいこと",p:[
"最終巻の前に一度眠ると、物語の余韻をじっくり味わいやすくなります。徹夜で一気に最後まで読み切ると、興奮のまま終わってしまい、あとから物語を振り返る時間が持てないことがあります。",
"最終巻を読む前に、これまでのお気に入りの場面を思い出してみるのもおすすめです。結末を迎えたときの感慨が、より深くなります。"]},
{h:"読み終えたあとの過ごし方",ul:[
"感想をノートやメモアプリに書き出してみる。",
"同じ作者の別作品を探してみる。",
"アニメ化されている作品なら、原作と見比べてみる。"]},
{h:"まとめ",p:["完結済みのマンガは、自分のペースで物語の全体を味わえる贅沢な読書体験です。次の週末は、気になっていた完結済み作品を手に取ってみてはいかがでしょうか。"]}
],
sources:["本記事は読書習慣に関する一般的な知見をもとに構成しています"],related:[17,20,21]},

{id:20,cat:"アニメ・マンガ",title:"声優の演技を聴き分ける入門｜同じ声なのに別人に聞こえる理由",
meta:"声優の演技は、息づかいや語尾の処理、声の質の変化で成り立っています。映像を見ずに音だけで再生して演技に注目する、具体的な聴き方のコツを紹介します。",
kw:["声優 演技 聴き分け","アニメ 音声"],
sum:"同じ声優が演じても、キャラクターごとに違って聞こえる理由を、演技の要素から解説。",
lead:"アニメを観ていて、同じ声優が演じているとは思えないほど印象の違うキャラクターに出会ったことはないでしょうか。声優の演技には、息づかいや語尾の処理など、注目すると面白い要素がいくつもあります。この記事では、演技を聴き分ける入門的な視点を紹介します。",
sections:[
{h:"演技を分けている3つの要素",ul:[
"息づかい：呼吸の速さや深さで、キャラクターの緊張感や落ち着きを表現します。",
"語尾の処理：語尾を伸ばすか、短く切るかで、性格の印象が大きく変わります。",
"感情が高ぶったときの声の質：怒りや悲しみの場面での声のざらつきや高さの変化が、キャラクターごとの個性を作ります。"],
p:["これらの要素は、意識して聴かないと見過ごしがちです。まずは1つの要素だけに注目して聴いてみると、違いに気づきやすくなります。"]},
{h:"具体的な聴き方のステップ",ul:[
"お気に入りの作品を1本選ぶ。",
"映像を見ずに、音声だけを再生する。",
"最初は物語の内容を追うのではなく、声の出し方だけに集中する。",
"同じ声優が演じる別の作品があれば、聴き比べてみる。"]},
{h:"聴き比べで気づくこと",p:[
"同じ声優でも、作品ごとに声の高さや話し方の速度を変えていることがあります。普段の会話シーンと、戦闘シーンなど感情が高ぶる場面とでは、声の使い方がまったく違う場合もあります。",
"アフレコでは、口の動き（リップシンク）に合わせて演技をする技術も求められます。台詞の長さやタイミングの正確さにも、注目してみると新しい発見があります。"]},
{h:"まとめ",p:["声優の演技は、キャラクターを立体的にする重要な要素です。次にアニメを観るときは、一度だけ目を閉じて、声だけに集中する時間を作ってみてください。"]}
],
sources:["本記事はアニメ・声優演技に関する一般的な知見をもとに構成しています"],related:[17,21,19]},

{id:21,cat:"アニメ・マンガ",title:"聖地巡礼のマナーと楽しみ方｜作品の舞台を歩くときに心にとめておきたいこと",
meta:"アニメやマンガの舞台となった実在の場所を訪れる「聖地巡礼」。住民の生活の場であることを忘れず、地元に還元する巡り方を紹介します。",
kw:["聖地巡礼 マナー","アニメ 舞台","ロケ地"],
sum:"作品の舞台となった街を訪れるときに大切にしたい、住民への配慮と地元への還元の仕方を紹介。",
lead:"好きな作品の舞台になった場所を、実際に歩いてみる「聖地巡礼」は、多くのファンにとって特別な体験です。ただし、その土地は、そこで暮らす人々の生活の場でもあります。この記事では、聖地巡礼を気持ちよく楽しむためのマナーを紹介します。",
sections:[
{h:"訪れる前に確認しておきたいこと",ul:[
"個人の住宅や私有地が舞台になっている場合、敷地内に立ち入らない。",
"撮影が許可されている場所かどうかを、事前に公式情報や地元の案内で確認する。",
"訪問可能な時間帯や、地域の行事の予定を調べておく。"]},
{h:"現地でのマナー",p:[
"住民の生活の場であることを忘れず、大きな声での会話や、早朝・深夜の訪問は避けましょう。写真や動画を撮る際は、周囲の人が映り込まないよう配慮することも大切です。",
"作品のグッズを身につけて歩くことは問題ありませんが、道いっぱいに広がって歩く、交通の妨げになる場所での撮影といった行為は控えましょう。"]},
{h:"地元に還元する巡り方",ul:[
"地元の飲食店で食事をする。",
"お土産を地元の商店で購入する。",
"「聖地巡礼ノート」が設置されている場合は、感謝の言葉とともに感想を書き残す。"],
p:["聖地巡礼をきっかけに地域を訪れるファンが増えたことで、観光振興につながった事例も少なくありません。訪問者一人ひとりの行動が、次の巡礼者を迎える地域の空気を作っていきます。"]},
{h:"まとめ",p:["聖地巡礼は、作品への愛情を形にする楽しい体験です。同時に、そこに暮らす人々への敬意を忘れずに、気持ちよく過ごせる巡り方を心がけましょう。"]}
],
sources:["本記事は聖地巡礼に関する一般的なマナーの知見をもとに構成しています"],related:[17,18,20]}
);

{id:22,cat:"ゲーム",title:"東京ゲームショウ2026レポート｜4日間で25万7642人来場、台風で最終日は中止に",
meta:"東京ゲームショウ2026は9月17〜20日に開催され、来場者25万7642人。台風25号の影響で5日目は中止となりました。過去最多53の国と地域から1,138企業が出展。開催結果を数字で振り返ります。",
kw:["東京ゲームショウ2026","TGS2026","来場者数","台風"],
sum:"30周年のTGS2026は4日間で25万7642人が来場。過去最多の出展規模と、台風による最終日中止の経緯を整理。",
lead:"「東京ゲームショウ2026」（TGS2026）が、9月17日から20日にかけて幕張メッセで開催されました。当初は5日間の開催予定でしたが、台風25号の接近により最終日は中止となりました。この記事では、来場者数などの結果を整理します。",
sections:[
{h:"来場者数は25万7642人｜前年から微減",p:[
"コンピュータエンターテインメント協会（CESA）の発表によると、4日間の総来場者数は25万7642人でした。過去最多だった2025年の26万3101人から、5,459人（約2.1%）の減少です。",
"日別では、ビジネスデイ初日の9月17日が5万3630人で前年を上回りました。一般公開初日の9月19日も7万8678人と、前年の7万7415人を上回っています。一方、2日目と最終営業日は前年を下回りました。"]},
{h:"出展規模は過去最多",p:[
"今回のTGS2026は「史上最長、遊びづくしの5DAYS」をテーマに開催されました。30周年を迎える今回は、過去最多となる53の国・地域から1,138の企業・団体が出展しています。",
"来場者数はわずかに減った一方、出展規模は拡大しており、「展示の場」から「ゲーム業界の総合イベント」へと役割が広がっている、との指摘もあります。"]},
{h:"台風25号で最終日は中止に",p:[
"当初、TGS2026は9月17日から21日までの5日間の開催を予定していました。しかし、台風25号の接近を受け、来場者や出展社、関係者の安全を最優先し、最終日である9月21日のリアル開催は中止となりました。",
"当日は、来場を伴わないオンライン配信のみが、可能な範囲で実施されました。"]},
{h:"2027年の開催は9月16日〜20日",p:[
"CESAは、次回「東京ゲームショウ2027」を、2027年9月16日から20日にかけて、幕張メッセで開催すると発表しています。"]},
{h:"まとめ",p:["台風という不測の事態はありましたが、出展規模は過去最多を記録し、TGSは着実に拡大を続けています。来年の開催に向けて、注目タイトルの発表が今後も続きそうです。"]}
],
sources:["CESA公式サイト「30周年の東京ゲームショウ2026 リアル開催閉幕」（2026年9月20日）","Yahoo!ニュース／ファミ通.com（2026年9月28日配信）","4Gamer.net（2026年9月20日）","gamebiz「TGS2026、来場者数は25万7642人で微減」","マイナビニュース（2026年9月24日）"],related:[24,25,23]},

{id:23,cat:"ゲーム",title:"Nintendo Switch 2、発売から1年で累計1986万台｜2027年3月期は3500万台超えの見通し",
meta:"任天堂の2026年3月期決算で、Nintendo Switch 2の累計販売台数が1986万台に到達したと発表。『マリオカート ワールド』は1470万本、連結売上高は前期比98.6%増の2兆3130億円でした。",
kw:["Switch2 販売台数","任天堂 決算","マリオカートワールド"],
sum:"発売1年目で1986万台を販売し、旧機種Switchの発売直後実績を上回るペース。決算資料をもとに数字で振り返る。",
lead:"任天堂の最新ゲーム機「Nintendo Switch 2」が、発売から1年で驚異的な販売実績を記録しています。2026年5月8日に公開された決算資料によると、2026年3月期（2025年4月〜2026年3月）の累計販売台数は1986万台でした。この記事では、決算資料をもとに、数字で振り返ります。",
sections:[
{h:"四半期ごとの販売台数の推移",ul:[
"第1四半期（2025年4〜6月）：582万台。発売直後の順調なスタートです。",
"第2四半期（2025年7〜9月）：454万台の増加。",
"第3四半期（2025年10〜12月）：701万台の増加。『カービィのエアライダー』の発売が重なった年末商戦です。",
"第4四半期（2026年1〜3月）：249万台の増加で、通期1986万台に到達しました。"],
p:["この実績は、旧機種であるNintendo Switchの発売直後の通期実績を上回る水準です。セルスルー（実売）ベースでも、任天堂の歴代ハードウェアの中で過去最速のペースとされています。"]},
{h:"好調なソフトウェアタイトル",ul:[
"『マリオカート ワールド』：本体セット販売分を含め1,470万本。",
"『ドンキーコング バナンザ』：452万本。",
"『Pokémon LEGENDS Z-A Nintendo Switch 2 Edition』：パッケージ版のみで394万本。",
"Switch 2向けソフト全体では、4,871万本を販売しました。"]},
{h:"連結売上高は前期比98.6%増",p:[
"Nintendo Switch 2の好調により、2026年3月期の任天堂の連結売上高は2兆3130億円となり、前期比98.6%の増収となりました。地域別では、日本国内が23.1%、国外が76.9%を占めています。",
"旧機種のNintendo Switchも、64.8%減とはなったものの、なお380万台を販売しています。Switch向けソフトは1億3691万本を売り上げました。"]},
{h:"2027年3月期の見通し",p:[
"2026年4〜6月期（2027年3月期第1四半期）のSwitch 2販売台数は382万台でした。世界累計販売台数は2,368万台に達しています。通期の販売計画は1,650万台とされ、年末商戦での上乗せが見込まれます。",
"Switch2の再値上げについては、ソフト販売が好調なこともあり、可能性は低いとする見方もあります。"]},
{h:"まとめ",p:["Nintendo Switch 2は、発売2年目に入っても堅調な販売を続けています。年末商戦に向けて、新作ソフトの発表にも注目が集まります。"]}
],
sources:["ファミ通.com「Switch2本体の累計販売台数は1986万」（2026年5月8日）","でんふぁみこゲーマー（2026年5月8日）","Game Business.jp（2026年5月8日）","GAZLOG「Nintendo Switch 2は発売2年目も堅調」（2026年8月）","ITmedia NEWS（2026年2月3日）"],related:[22,24,25]},

{id:24,cat:"ゲーム",title:"積みゲーを消化するための、現実的な優先順位のつけ方",
meta:"買っただけで満足してしまう「積みゲー」を、罪悪感なく消化するための考え方を紹介。クリアまでの時間、期間限定要素、今の気分の3つの基準で並べ替える方法です。",
kw:["積みゲー","消化 優先順位","ゲーム 遊び方"],
sum:"全部終わらせようとしないことが、実は一番の近道。積みゲーを整理する3つの基準を紹介。",
lead:"セールやプレゼントで手に入れたものの、まだ遊べていないゲームが増えていく「積みゲー」。罪悪感を覚える人も多いのではないでしょうか。この記事では、無理なく消化していくための、現実的な考え方を紹介します。",
sections:[
{h:"まず知っておきたい、積みゲーは悪いことではない",p:[
"ゲームを買うことと、遊ぶことは別の楽しみです。購入した時点で、そのゲームへの興味や応援の気持ちは、すでに形になっています。全部をクリアする必要はない、と考えるだけで気持ちが楽になります。"]},
{h:"優先順位をつける3つの基準",ul:[
"クリアまでの時間：忙しい時期には短時間で終わる作品、まとまった休みが取れそうなときには長編を選びます。",
"今の気分：じっくり考えたい気分か、テンポよく進めたい気分かで、選ぶジャンルを変えます。",
"期間限定の要素：オンライン要素があるゲームや、配信終了の予定があるタイトルは、優先度を上げて先に遊びます。"],
p:["この3つを、今持っている積みゲーのリストに当てはめて並べ替えるだけで、次に遊ぶ一本が自然と決まります。"]},
{h:"具体的な整理の手順",ul:[
"まず、持っているゲームのタイトルを一覧にする。",
"それぞれに、クリアまでの目安時間を書き添える（分からない場合は攻略サイトなどで確認）。",
"期間限定の要素があるものに印をつける。",
"残りを、今の気分で選べるように並べておく。"]},
{h:"手放すという選択肢",p:[
"どうしても興味が持てなくなった作品は、無理に消化しようとせず、売却や譲渡を検討するのも一つの方法です。積みゲーを減らすことよりも、今持っている時間で何を楽しむかを優先しましょう。"]},

{id:30,cat:"お笑い・舞台",title:"漫才とコントの違いを、笑いの仕組みから見る｜同じ「お笑い」でも設計図は別物",

PICKS.forEach(id=>{
  const a=byId(id), c=CATS[a.cat];
  const b=el("button",{class:"pick",type:"button",style:`background:${c.c};color:${c.t}`},[
    el("span",{class:"p-no",text:String(a.id).padStart(2,"0")}),
    el("span",{class:"p-cat",text:a.cat}),
    el("h3",{text:a.title}),
    el("p",{class:"p-lead",text:a.sum})
  ]);
  b.addEventListener("click",()=>openArt(id));
  $("#picksBox").append(b);
});

["すべて",...Object.keys(CATS)].forEach(n=>{
  const b=el("button",{class:"chip",type:"button","aria-pressed":n===cat?"true":"false",text:n});
  b.addEventListener("click",()=>{cat=n;[...chips.children].forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));render();});
  chips.append(b);
});
q.addEventListener("input",render);

function render(){
  const kw=q.value.trim().toLowerCase();
  const list=ARTICLES.filter(a=>(cat==="すべて"||a.cat===cat)&&(!kw||(a.title+a.sum+a.kw.join(" ")+a.cat).toLowerCase().includes(kw)));
  order=list.map(a=>a.id);
  grid.replaceChildren();
  count.textContent=`${list.length}本を表示中`;
  if(!list.length){grid.append(el("li",{class:"empty",text:"該当する記事がありません。キーワードかジャンルを変えてみてください。"}));return;}
  list.forEach(a=>{
    const c=CATS[a.cat];
    const t=el("button",{class:"ticket",type:"button","aria-label":`${a.title}（${a.cat}）を読む`},[
      el("div",{class:"stub",style:`background:${c.c};color:${c.t}`},[el("b",{text:String(a.id).padStart(2,"0")}),el("span",{text:a.cat})]),
      el("div",{class:"body"},[
        el("h3",{text:a.title}),
        el("p",{text:a.sum}),
        el("span",{class:"meta",text:`読了 約${readMin(a)}分`})
      ])
    ]);
    t.addEventListener("click",()=>openArt(a.id));
    grid.append(el("li",{},[t]));
  });
}

function renderSection(s){
  const wrap=el("div");
  if(s.h) wrap.append(el("h2",{text:s.h}));
  if(s.p) s.p.forEach(t=>wrap.append(el("p",{text:t})));
  if(s.ul){ const ul=el("ul"); s.ul.forEach(t=>ul.append(el("li",{text:t}))); wrap.append(ul); }
  return wrap;
}

function openArt(id){
  const a=byId(id), c=CATS[a.cat];
  artBody.replaceChildren();
  const catTag=el("span",{class:"art-cat",style:`background:${c.c};color:${c.t}`,text:a.cat});
  artBody.append(catTag);
  artBody.append(el("h1",{class:"art-h1",text:a.title}));
  artBody.append(el("div",{class:"art-meta"},[
    el("span",{text:`読了 約${readMin(a)}分`})
  ]));
  artBody.append(el("p",{class:"art-desc",text:a.meta}));
  const body=el("div",{class:"art-body"});
  body.append(el("p",{text:a.lead}));
  a.sections.forEach(s=>body.append(renderSection(s)));
  artBody.append(body);

  const src=el("details",{class:"art-sources"});
  src.append(el("summary",{text:"情報源を見る"}));
  const sul=el("ul");
  a.sources.forEach(s=>sul.append(el("li",{text:s})));
  src.append(sul);
  artBody.append(src);

  if(a.related && a.related.length){
    const rel=el("div",{class:"related"});
    rel.append(el("h3",{text:"あわせて読みたい"}));
    const rg=el("ul",{class:"grid"});
    a.related.forEach(rid=>{
      const ra=byId(rid); if(!ra) return;
      const rc=CATS[ra.cat];
      const t=el("button",{class:"ticket",type:"button"},[
        el("div",{class:"stub",style:`background:${rc.c};color:${rc.t}`},[el("b",{text:String(ra.id).padStart(2,"0")}),el("span",{text:ra.cat})]),
        el("div",{class:"body"},[el("h3",{text:ra.title}),el("p",{text:ra.sum}),el("span",{class:"meta",text:`読了 約${readMin(ra)}分`})])
      ]);
      t.addEventListener("click",()=>openArt(rid));
      rg.append(el("li",{},[t]));
    });
    rel.append(rg);
    artBody.append(rel);
  }

  listView.classList.add("hide");
  articleView.classList.add("show");
  window.scrollTo({top:0,behavior:"instant" in window ? "instant":"auto"});
  history.pushState({art:id},"", "#article-"+id);
  document.title = a.title + "｜幕間";
}
function closeArt(){
  articleView.classList.remove("show");
  listView.classList.remove("hide");
  history.pushState({},"", location.pathname);
  document.title="幕間 — エンタメ厳選30本";
}
$("#backBtn").addEventListener("click",closeArt);
$("#logoBtn").addEventListener("click",()=>{ closeArt(); window.scrollTo({top:0,behavior:"smooth"}); });
document.querySelectorAll('[data-nav]').forEach(b=>{
  b.addEventListener("click",()=>{
    closeArt();
    document.getElementById(b.dataset.nav).scrollIntoView({behavior:"smooth"});
  });
});
window.addEventListener("popstate",()=>{
  const m=location.hash.match(/^#article-(\d+)/);
  if(m) openArt(Number(m[1])); else closeArt();
});

function pickTonight(){
  let n; do{ n=Math.floor(Math.random()*ARTICLES.length);}while(n===tonight&&ARTICLES.length>1);
  tonight=n; showTonight();
}
function showTonight(){
  const a=ARTICLES[tonight], c=CATS[a.cat];
  $("#tTitle").textContent=a.title;
  const t=$("#tCat"); t.textContent=a.cat; t.style.background=c.c; t.style.color=c.t;
  $("#tMeta").textContent=`読了 約${readMin(a)}分`;
}
$("#tShuffle").addEventListener("click",pickTonight);
$("#tOpen").addEventListener("click",()=>openArt(ARTICLES[tonight].id));
tonight=Math.floor(Math.random()*ARTICLES.length);
showTonight();
render();

const m0=location.hash.match(/^#article-(\d+)/);
if(m0) openArt(Number(m0[1]));
</script>
</body>
</html>
